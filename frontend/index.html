<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisanat Patrimoine - Plateforme Traditionnelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfbf7;
            scroll-behavior: smooth;
        }

        h1,
        h2,
        h3,
        .font-heritage {
            font-family: 'Playfair Display', serif;
        }

        .zellige-pattern {
            background-image: url("https://www.transparenttextures.com/patterns/az-subtle.png");
        }

        .moroccan-gradient {
            background: linear-gradient(135deg, #c2410c 0%, #7c2d12 100%);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .moorish-arch {
            border-top-left-radius: 50% 60%;
            border-top-right-radius: 50% 60%;
            overflow: hidden;
            border: 1px solid #fed7aa;
        }

        .moorish-arch-inner {
            border-top-left-radius: 50% 58%;
            border-top-right-radius: 50% 58%;
        }

        @keyframes slideCarousel {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-slide {
            animation: slideCarousel 40s linear infinite;
        }

        .animate-slide:hover {
            animation-play-state: paused;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
